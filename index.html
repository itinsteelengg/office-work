<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Work</title>
<meta name="theme-color" content="#1E7A55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Office Work">
<style>
  :root{ --bg:#EDF1EE; --ink:#16302A; --muted:#5D706A; --green:#1E7A55; --surface:#FFFFFF; --line:#D2DCD7; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0F1A17; --ink:#E5EEEA; --muted:#9AB0A8; --green:#3DAA7C; --surface:#172622; --line:#2A3D37; } }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
  #msg{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:var(--bg)}
  #msg.show{display:grid}
  #msg b{display:block;font-size:20px;margin-bottom:6px}
  #install{position:fixed;left:12px;right:12px;top:12px;max-width:520px;margin:0 auto;display:none;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:10;gap:12px;align-items:center}
  #install.show{display:flex}
  #install img{width:44px;height:44px;border-radius:10px;flex:none}
  #install .txt{flex:1;font-size:15px;line-height:1.35}
  #install .txt b{display:block;font-size:16px}
  #install .txt span{color:var(--muted)}
  #install button{font:inherit;font-weight:600;border-radius:10px;padding:8px 14px;min-height:42px;border:1px solid var(--line);background:none;color:var(--ink)}
  #install button.go{background:var(--green);border-color:var(--green);color:#fff}
  .acts{display:flex;gap:6px;flex:none}
</style>
</head>
<body>
<!-- ↓↓↓ Paste your Apps Script web app link (ending in /exec) here ↓↓↓ -->
<script>const APP_URL = 'https://script.google.com/macros/s/AKfycbwywlfK1Ru7eSJrDPMmzkzFLT5GtWmkKfMUD2c8CEI95Jw78BcMH2l9BL7CrzcRQLmMAw/exec';</script>

<iframe id="app" title="Office Work" allow="clipboard-write"></iframe>
<div id="msg"><div><b id="msgT"></b><span id="msgB"></span></div></div>
<div id="install" role="dialog" aria-label="Install app">
  <img src="icon-192.png" alt="">
  <div class="txt"><b>Install Office Work</b><span id="instTxt">Add it to your phone like a normal app.</span></div>
  <div class="acts"><button id="later">Not now</button><button class="go" id="go">Install</button></div>
</div>

<script>
const frame = document.getElementById('app');
const msg = (t, b) => { document.getElementById('msgT').textContent = t; document.getElementById('msgB').textContent = b; document.getElementById('msg').className = 'show'; };

if (APP_URL.includes('PASTE_YOUR')) msg('Link not set', 'Open index.html and paste the Apps Script web app link into APP_URL.');
else if (!navigator.onLine) msg('No internet', 'Connect to the internet and open the app again.');
else frame.src = APP_URL;

window.addEventListener('online', () => { if (!frame.src && !APP_URL.includes('PASTE_YOUR')){ document.getElementById('msg').className = ''; frame.src = APP_URL; } });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- Install pop-up ---------- */
const box = document.getElementById('install'), go = document.getElementById('go');
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const snoozed = () => { try { return Date.now() < +(localStorage.getItem('installSnooze') || 0); } catch(e){ return false; } };
const snooze = () => { try { localStorage.setItem('installSnooze', Date.now() + 2*24*3600*1000); } catch(e){} box.className = ''; };
let deferred = null;

window.addEventListener('beforeinstallprompt', e => {   // Android Chrome, Edge, Samsung Internet, desktop Chrome
  e.preventDefault();
  deferred = e;
  if (!standalone && !snoozed()) box.className = 'show';
});

go.onclick = async () => {
  if (!deferred){ snooze(); return; }
  deferred.prompt();
  await deferred.userChoice;
  deferred = null; box.className = '';
};
document.getElementById('later').onclick = snooze;
window.addEventListener('appinstalled', () => { box.className = ''; deferred = null; });

// iPhone/iPad cannot show an install button, so show the steps instead
if (isIOS && !standalone && !snoozed()){
  document.getElementById('instTxt').textContent = 'Tap the Share button, then "Add to Home Screen".';
  go.textContent = 'OK';
  box.className = 'show';
}
</script>
</body>
</html>
